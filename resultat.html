<style>
  :root {
    --rosa: #ff66c4; --rosa-dyp: #d6339b; --rosa-lys: #ffe3f3;
    --svart: #0d0b0c; --kull: #1c1719; --hvit: #ffffff; --grunn: #fdf8f9;
    --tekst: #1c1719; --dempet: #6b5d63; --linje: #ecdfe4;
    --rosegull: #e0a98f; --rosegull-lys: #f3cdb9;
    --display: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
    --brod: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    --hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;
    --maks: 1100px;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  body { margin: 0; background: var(--grunn); color: var(--tekst); font-family: var(--brod); font-size: 18px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  img { max-width: 100%; display: block; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--rosa); outline-offset: 3px; border-radius: 4px; }
  .ramme { width: 100%; max-width: var(--maks); margin: 0 auto; padding-inline: 24px; }
  @media (max-width: 480px) { .ramme { padding-inline: 18px; } body { font-size: 17px; } }
  h1, h2, h3 { font-family: var(--display); line-height: 1.05; letter-spacing: -0.02em; text-wrap: balance; margin: 0; }
  h2 { font-size: clamp(1.9rem, 4vw, 3rem); font-weight: 800; }
  h3 { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.01em; }
  p { margin: 0; }
  .hand { font-family: var(--hand); font-weight: 700; }
  .etikett { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--rosa-dyp); }
  .knapp { display: inline-flex; align-items: center; gap: 10px; font-family: var(--brod); font-weight: 700; font-size: 1rem; padding: 15px 26px; border-radius: 999px; text-decoration: none; border: 2px solid var(--svart); cursor: pointer; transition: transform .15s ease, box-shadow .15s ease, background .15s ease; }
  .knapp-rosa { background: var(--rosa); color: var(--svart); box-shadow: 4px 4px 0 var(--svart); }
  .knapp-rosa:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--svart); }
  .knapp-strek { background: transparent; color: var(--svart); }
  .knapp-strek:hover { background: var(--svart); color: var(--hvit); }

  .meny { background: var(--grunn); border-bottom: 1px solid var(--linje); }
  .meny .ramme { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 14px; }
  .logo { font-family: var(--display); font-weight: 800; font-size: 1.3rem; text-decoration: none; letter-spacing: -0.02em; white-space: nowrap; }
  .logo span { color: var(--rosa-dyp); }
  .meny .knapp { padding: 10px 18px; font-size: 0.92rem; box-shadow: 3px 3px 0 var(--svart); gap: 0; }
  @media (max-width: 420px) { .meny .knapp .lang { display: none; } }

  section { padding-block: clamp(56px, 8vw, 96px); }

  /* Toppen */
  .topp { padding-block: clamp(40px, 6vw, 72px) clamp(48px, 7vw, 88px); }
  .topp .ramme { display: grid; grid-template-columns: 1.25fr 0.75fr; gap: clamp(28px, 5vw, 64px); align-items: center; }
  .topp h1 { font-size: clamp(2.5rem, 6vw, 4.6rem); font-weight: 800; margin-top: 14px; }
  .topp h1 .felle { background: linear-gradient(transparent 60%, var(--rosa) 60%, var(--rosa) 90%, transparent 90%); padding-inline: 2px; }
  .topp .kort { font-size: clamp(1.15rem, 1.8vw, 1.4rem); margin-top: 20px; max-width: 36ch; }
  .brikker { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 26px; }
  .brikke { border: 1.5px solid var(--svart); border-radius: 999px; padding: 6px 14px; font-size: .9rem; font-weight: 600; background: var(--hvit); }
  .brikke b { color: var(--rosa-dyp); }

  .maaler { background: var(--svart); color: var(--hvit); border-radius: 24px; padding: 28px 26px; box-shadow: 6px 6px 0 var(--rosa); }
  .maaler .etikett { color: var(--rosa); }
  .maaler .tall { font-family: var(--display); font-weight: 800; font-size: 4.4rem; line-height: 1; margin-top: 10px; font-variant-numeric: tabular-nums; }
  .maaler .tall small { font-size: 1.4rem; color: #a99ca2; font-weight: 700; }
  .maaler .nivaa { font-family: var(--hand); font-size: 1.7rem; color: var(--rosegull); margin-top: 4px; }
  .bar { height: 14px; border-radius: 99px; background: #3a3034; margin-top: 16px; overflow: hidden; }
  .bar span { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--rosegull), var(--rosa)); transition: width 1.2s cubic-bezier(.2,.8,.2,1); }
  .skala { display: flex; justify-content: space-between; font-size: .78rem; color: #a99ca2; margin-top: 8px; }
  .maaler .forklar { font-size: .88rem; color: #c9bec3; margin-top: 16px; }
  @media (max-width: 860px) { .topp .ramme { grid-template-columns: 1fr; } }

  /* Hvor du står */
  .staar { background: var(--hvit); border-block: 1px solid var(--linje); }
  .staar .ramme { display: grid; grid-template-columns: 0.8fr 1.2fr; gap: clamp(28px, 5vw, 64px); align-items: start; }
  .staar .tekst p + p { margin-top: 16px; }
  .staar .tekst { max-width: 62ch; }
  .fase { margin-top: 22px; padding: 18px 20px; border-radius: 16px; background: var(--rosa-lys); font-size: 1rem; }
  .fase b { font-family: var(--display); }
  @media (max-width: 860px) { .staar .ramme { grid-template-columns: 1fr; } }

  /* Koster */
  .koster { background: var(--svart); color: var(--hvit); }
  .koster .etikett { color: var(--rosa); }
  .koster h2 { margin-top: 12px; max-width: 20ch; }
  .tallrad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: #3a3034; border: 1px solid #3a3034; border-radius: 24px; overflow: hidden; margin-top: 40px; }
  .tallrad > div { background: var(--kull); padding: 26px 24px; }
  .tallrad .stort { font-family: var(--display); font-weight: 800; font-size: clamp(2.2rem, 4vw, 3.2rem); line-height: 1; color: var(--rosa); font-variant-numeric: tabular-nums; }
  .tallrad .hva { color: #c9bec3; font-size: .98rem; margin-top: 10px; }
  .koster .setning { margin-top: 32px; font-size: 1.15rem; color: #eadfe3; max-width: 60ch; }
  .koster .regnestykke { margin-top: 12px; font-size: .88rem; color: #a99ca2; }
  @media (max-width: 760px) { .tallrad { grid-template-columns: 1fr; } }

  /* Droppe + plan */
  .toveis .ramme { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(28px, 4vw, 48px); align-items: start; }
  .kort-boks { background: var(--hvit); border: 2px solid var(--svart); border-radius: 24px; padding: clamp(24px, 3vw, 34px); }
  .kort-boks h2 { font-size: clamp(1.6rem, 3vw, 2.2rem); margin-top: 10px; }
  .droppliste, .planliste { list-style: none; padding: 0; margin: 24px 0 0; display: grid; gap: 14px; }
  .droppliste li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; }
  .droppliste .kryss { width: 28px; height: 28px; border-radius: 50%; background: var(--svart); color: var(--rosa); display: grid; place-items: center; font-weight: 800; font-size: .95rem; margin-top: 2px; }
  .droppliste .ting { text-decoration: line-through; text-decoration-color: var(--rosa); text-decoration-thickness: 3px; font-weight: 700; }
  .droppliste .hvorfor { display: block; color: var(--dempet); font-size: .98rem; margin-top: 2px; }
  .planliste li { border-left: 3px solid var(--rosa); padding-left: 16px; }
  .planliste .naar { font-family: var(--display); font-weight: 800; display: block; font-size: 1.05rem; }
  .planliste .gjor { color: var(--kull); }
  @media (max-width: 860px) { .toveis .ramme { grid-template-columns: 1fr; } }

  /* Plattform */
  .plattform { background: var(--hvit); border-block: 1px solid var(--linje); }
  .plattform .ramme { max-width: 900px; }
  .plattform h2 .navn { color: var(--rosa-dyp); }
  .plattform .hvorfor { margin-top: 18px; font-size: 1.1rem; max-width: 62ch; }
  .oppskrift { list-style: none; counter-reset: steg; padding: 0; margin: 32px 0 0; display: grid; gap: 16px; }
  .oppskrift li { counter-increment: steg; display: grid; grid-template-columns: 48px 1fr; gap: 16px; align-items: start; background: var(--grunn); border: 1px solid var(--linje); border-radius: 18px; padding: 20px; }
  .oppskrift li::before { content: counter(steg); width: 48px; height: 48px; border-radius: 50%; background: var(--rosa); border: 2px solid var(--svart); display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 1.3rem; }
  .oppskrift b { display: block; font-family: var(--display); font-size: 1.1rem; }
  .oppskrift span { color: var(--dempet); }
  .ogsaa { margin-top: 22px; color: var(--dempet); font-size: .98rem; }

  /* TUK */
  .tuk { background: var(--svart); color: var(--hvit); }
  .tuk .ramme { display: grid; grid-template-columns: auto 1fr; gap: clamp(28px, 5vw, 64px); align-items: center; }
  .bue { position: relative; margin: 0; width: 300px; max-width: 100%; }
  .bue img { width: 100%; height: auto; border-radius: 50% 50% 18px 18px / 40% 40% 18px 18px; border: 2px solid var(--rosegull); box-shadow: 6px 6px 0 var(--rosa); }
  .bue .ai-merke { top: auto; right: auto; bottom: 14px; left: 14px; }
  .fotoband { position: relative; margin: 0; height: clamp(240px, 30vw, 380px); border-radius: 24px; overflow: hidden; border: 2px solid var(--rosegull); background: var(--kull); display: flex; justify-content: center; }
  .fotoband .bak { position: absolute; inset: -40px; width: calc(100% + 80px); height: calc(100% + 80px); max-width: none; object-fit: cover; filter: blur(26px) saturate(1.1) brightness(.75); }
  .fotoband .fram { position: relative; height: 100%; width: auto; max-width: 100%; object-fit: contain; box-shadow: 0 0 60px rgba(0,0,0,.35); }
  .fotoband .ai-merke { z-index: 3; }
  @media (max-width: 600px) { .fotoband { height: 260px; } }
  .ai-merke { position: absolute; top: 14px; right: 14px; background: rgba(13,11,12,.78); color: var(--hvit); font-size: 0.72rem; font-weight: 600; letter-spacing: 0.04em; padding: 5px 10px; border-radius: 999px; }
  .tuk .etikett { color: var(--rosa); }
  .tuk h2 { margin-top: 12px; }
  .tuk h2 .kaos { font-family: var(--hand); color: var(--rosegull); font-size: 1.2em; letter-spacing: 0; }
  .tuk p.tekst { color: #d9cfd3; margin-top: 18px; max-width: 54ch; }
  .tuk ul { list-style: none; padding: 0; margin: 22px 0 0; display: grid; gap: 10px; color: #eadfe3; }
  .tuk ul li::before { content: "♡ "; color: var(--rosa); font-weight: 700; }
  .tuk .knapperad { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-top: 30px; }
  .tuk .knapp-rosa { border-color: var(--rosa); box-shadow: 4px 4px 0 var(--rosegull); }
  .tuk .pris { color: #c9bec3; font-size: .95rem; }
  @media (max-width: 860px) { .tuk .ramme { grid-template-columns: 1fr; } .tuk .bue { width: 260px; } }

  .hilsen { text-align: center; }
  .hilsen .ramme { max-width: 640px; }
  .hilsen p { color: var(--dempet); }
  .hilsen .hand { font-size: 2.4rem; color: var(--tekst); margin-top: 16px; }
  .hilsen .lenker { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin-top: 26px; }

  .tom { text-align: center; padding-block: 120px; }
  .tom p { color: var(--dempet); margin-block: 16px 28px; }

  footer { background: var(--svart); color: #9a8c92; padding-block: 28px; font-size: .88rem; }
  footer .ramme { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
</style>
